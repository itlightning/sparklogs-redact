name: dependency advisories

# Checks every npm dependency (shipped and development, any severity) against known security
# advisories with scripts/audit-gate.mjs; advisory-ignore.json holds the only exceptions. The
# build + test + smoke job in ci.yml runs the same gate through `make ci`; this workflow adds the
# daily run, which catches advisories published after a change merged, and records the result.
#
# On a push to main, the daily run and a manual run, the record job keeps one open issue labeled
# dependency-advisory while the check fails and closes it when the check passes. Pull requests
# never touch issues. GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity; if the daily run stops, re-enable it in the Actions tab.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.audit.outputs.findings }}
    steps:
      - name: Check out sparklogs-redact
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Check dependency advisories
        id: audit
        run: node scripts/audit-gate.mjs --github-output "$GITHUB_OUTPUT"

  record:
    name: record advisory result
    needs: scan
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out sparklogs-redact
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Record the result as an issue
        uses: ./.github/actions/advisory-issue
        with:
          result: ${{ needs.scan.result }}
          findings: ${{ needs.scan.outputs.findings }}
